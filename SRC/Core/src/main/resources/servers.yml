# ========================================
# CONFIGURAÇÃO DO MENU DE SERVIDORES
# ========================================

# Configurações gerais do menu
title: 'Modos de Jogo'
rows: 3

# Slots que não redirecionam mesmo com servidores
# Útil para quando você já está em um servidor do minigame
disabled-slots: 
  - 10

# Configuração dos itens do menu
items:
  
  # ========================================
  # LOBBY PRINCIPAL
  # ========================================
  
  lobby:
    slot: 10
    icon: 'BOOKSHELF : 1 : nome>&6Lobby Principal : desc>&e► Clique para conectar!'
    
    # Quantidade máxima de jogadores por lobby
    max-players: 50
    
    # Servidores para requisitar os dados
    # Formato: IP:PORTA ; BungeeServerName
    # BungeeServerName = nome do servidor na config.yml do bungeecord
    servernames:
      - '127.0.0.1:25565 ; lobby'
  
  # ========================================
  # SKY WARS
  # ========================================
  
  skywars:
