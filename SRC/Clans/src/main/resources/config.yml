# Chave de ativação
chave: '{key}'
# Mostrar as Changelogs do Clan ao entrar.
join-report-card: true
# Ativar se estiver utilizando BungeeCord
bungeecord: false
database:
  mysql:
    # Host para acessar o MySQL
    host: 'localhost'
    # Porta para acessar o MySQL
    porta: '3306'
    # Nome do banco de dados no MySQL
    nome: 'server'
    # Usuário de acesso ao MySQL
    usuario: 'root'
    # Senha de acesso ao MySQL
    senha: ''